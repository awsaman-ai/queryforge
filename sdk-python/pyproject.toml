# Packaging for the QueryForge Python SDK.
#
# One wheel is built per platform, each carrying exactly the one engine binary
# that platform can execute. That is why there is no universal wheel: bundling
# all five targets would put ~75 MB into every install so that four of the
# binaries could sit unused on disk, and would push the artifact close to PyPI's
# per-file limit for no benefit.
#
# The wheel is therefore NOT pure-Python, and must be tagged with a platform. See
# scripts/build_wheels.py, which builds each Go target and stamps the matching
# wheel tag.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is "queryforge-ai"; the import name stays "queryforge".
# Plain "queryforge" was taken on PyPI in May 2026 by an unrelated SQLAlchemy
# project, and PyPI names are first-come. Only `pip install` says -ai; every
# line of user code is still `from queryforge import QueryForge`.
name = "queryforge-ai"
version = "1.2.0"
description = "Natural language to SQL and MongoDB queries, with a validated AST in between"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Aman" }]
keywords = ["nlp", "sql", "mongodb", "query", "natural-language", "text-to-sql", "llm"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # No "License :: OSI Approved :: ..." classifier here on purpose. PEP 639 replaced it with the
    # `license` expression above, and setuptools>=77 -- which this build requires -- treats having
    # both as a hard error, which would fail the wheel build at release time.
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime dependencies, deliberately. The SDK is a thin wrapper over a bundled
# executable and needs nothing beyond the standard library: json, subprocess,
# pathlib. A dependency-free install is one fewer thing to audit in an enterprise
# review, and one fewer thing that can conflict in a user's environment.
dependencies = []

[project.urls]
Homepage = "https://github.com/awsaman-ai/queryforge"
Documentation = "https://github.com/awsaman-ai/queryforge#readme"
Source = "https://github.com/awsaman-ai/queryforge"
Issues = "https://github.com/awsaman-ai/queryforge/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
# The bundled executable has no file extension on Unix, so setuptools' default
# extension-based matching would drop it from the wheel. Naming it explicitly is
# what puts it in the artifact.
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["queryforge*"]

[tool.setuptools.package-data]
queryforge = ["bin/*", "bin/*/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict markers so a typo'd marker fails rather than silently skipping a test.
addopts = "-ra --strict-markers"
